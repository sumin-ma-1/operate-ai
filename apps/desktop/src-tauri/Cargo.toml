[package]
name = "operate-ai-desktop"
version = "0.1.6"
description = "Operate AI desktop shell"
authors = ["Operate AI"]
edition = "2021"

[lib]
name = "operate_ai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
