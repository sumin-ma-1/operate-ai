<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operate AI</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #060912;
        color: rgba(255, 255, 255, 0.85);
      }
      main {
        min-height: 100%;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 2rem;
      }
      h1 {
        margin: 0 0 1.25rem;
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .dots {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.55rem;
        height: 1.5rem;
      }
      .dots span {
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        background: #9eb8d8;
        display: block;
        animation: pulse-color 1.05s ease-in-out infinite;
      }
      .dots span:nth-child(1) {
        animation-delay: 0s;
      }
      .dots span:nth-child(2) {
        animation-delay: 0.18s;
      }
      .dots span:nth-child(3) {
        animation-delay: 0.36s;
      }
      @keyframes pulse-color {
        0%,
        70%,
        100% {
          background: #4a5a72;
          opacity: 0.45;
        }
        35% {
          background: #b8d0ee;
          opacity: 1;
        }
      }
      #status {
        display: none;
        margin: 0;
        max-width: 28rem;
        color: #f0a0a0;
        font-size: 0.9rem;
        line-height: 1.45;
        word-break: break-word;
      }
      body.is-error .dots {
        display: none;
      }
      body.is-error #status {
        display: block;
      }
      @media (prefers-reduced-motion: reduce) {
        .dots span {
          animation: none;
          opacity: 0.75;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>Hello Operate AI</h1>
        <div class="dots" aria-label="Starting local editor" role="status">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <p id="status"></p>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
